kind = "web"
previewPath = "/"
title = "Wanderlust - Adventure Travel"
version = "1.0.0"
id = "artifacts/wanderlust"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21455

[services.development]
run = "pnpm --filter @workspace/wanderlust run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wanderlust", "run", "build" ]
publicDir = "artifacts/wanderlust/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21455"
BASE_PATH = "/"
